<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Кнопка</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at center, #1a0909 0, #090909 58%);
      color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden;
    }
    main { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 24px; }
    button {
      width: min(72vw, 280px); aspect-ratio: 1; border: 0; border-radius: 50%;
      background: linear-gradient(145deg, #ff3434, #b90000);
      color: white; font-size: clamp(20px, 5vw, 27px); font-weight: 900;
      letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 0 28px #ff171766, inset 0 4px 10px #ffffff35, inset 0 -9px 16px #57000080;
      transition: transform .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.94); filter: brightness(1.15); }
    button:focus-visible { outline: 3px solid white; outline-offset: 8px; }
    #message {
      min-height: 1.4em; text-align: center; font-size: clamp(26px, 7vw, 44px);
      font-weight: 900; letter-spacing: 1px; color: #ff3838;
      text-shadow: 0 0 22px #ff000077;
    }
  </style>
</head>
<body>
  <main>
    <button id="trigger" type="button">НАЖМИ МЕНЯ</button>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    const button = document.getElementById('trigger');
    const message = document.getElementById('message');
    let timeout;
    button.addEventListener('click', () => {
      clearTimeout(timeout);
      message.textContent = 'ИДИ НАХУЙ';
      timeout = setTimeout(() => { message.textContent = ''; }, 5000);
    });
  </script>
</body>
</html>
